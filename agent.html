<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#030303"/>
<title>Josh Pratt — Blackline Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { height:100%; }
body {
  background: #030303;
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2.5rem 1.25rem;
  overflow-x: hidden;
  position: relative;
}

/* ── AMBIENT ORBS ── */
.orb {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(70px);
}
.orb-1 {
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(255,255,255,0.045) 0%, transparent 70%);
  top: -120px; left: -80px;
  animation: drift1 10s ease-in-out infinite alternate;
}
.orb-2 {
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
  bottom: -80px; right: -60px;
  animation: drift2 13s ease-in-out infinite alternate;
}
.orb-3 {
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(180,180,180,0.025) 0%, transparent 70%);
  top: 40%; left: 50%;
  transform: translate(-50%,-50%);
  animation: drift3 9s ease-in-out infinite alternate;
}
@keyframes drift1 { to { transform: translate(50px, 60px); } }
@keyframes drift2 { to { transform: translate(-40px, -50px); } }
@keyframes drift3 { 0%{transform:translate(-50%,-50%) scale(1);} 100%{transform:translate(-45%,-55%) scale(1.15);} }

/* ── CAR SILHOUETTE ── */
.car-bg {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(96vw, 560px);
  opacity: 0;
  pointer-events: none;
  z-index: 0;
  animation: carReveal 2s 1.2s ease forwards;
}
@keyframes carReveal { to { opacity: 0.055; } }
.car-bg .car-sweep {
  animation: carLight 5s 2.5s ease-in-out infinite;
}
@keyframes carLight {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.5; }
}

/* ── CARD ── */
.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 2.2rem;
  border-radius: 32px;
  background: rgba(255,255,255,0.065);
  backdrop-filter: blur(60px) saturate(200%);
  -webkit-backdrop-filter: blur(60px) saturate(200%);
  border: 1px solid rgba(255,255,255,0.11);
  box-shadow:
    0 2px 0 rgba(255,255,255,0.13) inset,
    0 -1px 0 rgba(255,255,255,0.04) inset,
    0 40px 100px rgba(0,0,0,0.75),
    0 12px 40px rgba(0,0,0,0.5);
  animation: cardIn 0.9s cubic-bezier(0.16,1,0.3,1) both;
  overflow: hidden;
}
@keyframes cardIn {
  from { opacity:0; transform:translateY(30px) scale(0.95); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}

/* top shine */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 8%; right: 8%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
  pointer-events: none;
}

/* ── CARD HEADER (dark strip) ── */
.card-header {
  width: 100%;
  padding: 2.2rem 2rem 1.8rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(58,58,58,0.5) 0%, rgba(10,10,10,0.55) 60%, rgba(0,0,0,0.38) 100%);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  position: relative;
  overflow: hidden;
}
.card-header::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.022;
  background-image:
    linear-gradient(rgba(255,255,255,0.9) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.9) 1px, transparent 1px);
  background-size: 10px 10px;
  z-index: 0;
}
.card-header::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.04) 50%, transparent 70%);
  transform: translateX(-150%);
  animation: headerSheen 3s 2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes headerSheen {
  0%   { transform: translateX(-150%); opacity: 0; }
  30%  { opacity: 1; }
  100% { transform: translateX(150%); opacity: 0; }
}

/* ── LOGO ── */
.logo-wrap {
  width: min(84vw, 300px);
  position: relative;
  overflow: hidden;
  animation: logoIn 0.9s 0.1s cubic-bezier(0.16,1,0.3,1) both;
  filter: brightness(0) invert(1);
  margin-bottom: -0.4rem;
}
.logo-wrap img { width:100%; display:block; }
.logo-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 25%, rgba(255,255,255,0.35) 50%, transparent 75%);
  transform: translateX(-150%);
  animation: logoShimmer 1.2s 0.6s cubic-bezier(0.77,0,0.175,1) forwards;
  pointer-events: none;
}
@keyframes logoIn {
  from { opacity:0; transform:scale(0.92) translateY(-8px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}
@keyframes logoShimmer { to { transform: translateX(150%); } }

/* ── IDENTITY ── */
.identity {
  text-align: center;
  margin-top: 1.4rem;
  animation: fadeUp 0.7s 0.3s cubic-bezier(0.16,1,0.3,1) both;
}
.name {
  font-family: 'Syncopate', sans-serif;
  font-weight: 700;
  font-size: clamp(1.05rem, 4.5vw, 1.3rem);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #fff;
  line-height: 1.2;
}
.role {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 300;
  font-size: clamp(0.9rem, 3.5vw, 1.05rem);
  color: rgba(255,255,255,0.70);
  margin-top: 0.35rem;
  letter-spacing: 0.04em;
}

/* ── SERVICE PILLS ── */
.stars {
  font-size: 0.57rem;
  letter-spacing: 0.14em;
  color: rgba(255,230,120,0.55);
  margin-top: 0.45rem;
  text-align: center;
}
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  justify-content: center;
  margin-top: 1.1rem;
  padding: 0 0.5rem;
  animation: fadeUp 0.7s 0.4s cubic-bezier(0.16,1,0.3,1) both;
}
.pill {
  font-size: 0.52rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.38);
  padding: 0.28rem 0.65rem;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 100px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(8px);
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.pill:hover {
  color: rgba(255,255,255,0.65);
  border-color: rgba(255,255,255,0.22);
  background: rgba(255,255,255,0.08);
}

/* ── CARD BODY ── */
.card-body {
  width: 100%;
  padding: 0 1.75rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── BUBBLE BUTTONS ── */
.bubbles {
  display: flex;
  justify-content: center;
  gap: 0.9rem;
  margin-top: 2rem;
  width: 100%;
  animation: bubblesIn 0.8s 0.5s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes bubblesIn {
  from { opacity:0; transform:scale(0.8) translateY(10px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}
.bubble {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.55rem;
  cursor: pointer;
  text-decoration: none;
  background: none;
  border: none;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.bubble-icon {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,0.18);
  box-shadow:
    0 1.5px 0 rgba(255,255,255,0.22) inset,
    0 10px 30px rgba(0,0,0,0.4),
    0 2px 8px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
  color: #fff;
  transition:
    transform 0.22s cubic-bezier(0.34,1.56,0.64,1),
    background 0.2s ease,
    box-shadow 0.2s ease;
  position: relative;
  overflow: hidden;
}
/* ripple on tap */
.bubble-icon::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  opacity: 0;
  transform: scale(0.6);
  transition: none;
}
.bubble:active .bubble-icon::after {
  animation: ripple 0.35s ease-out forwards;
}
@keyframes ripple {
  to { opacity:0; transform:scale(1.4); }
}
.bubble:hover .bubble-icon {
  background: rgba(255,255,255,0.13);
  box-shadow: 0 1.5px 0 rgba(255,255,255,0.28) inset, 0 16px 40px rgba(0,0,0,0.45);
  transform: translateY(-3px) scale(1.05);
}
.bubble:active .bubble-icon {
  transform: scale(0.9);
}

/* Book bubble — glowing white, primary CTA */
.bubble-filled .bubble-icon {
  background: #ffffff;
  border-color: rgba(255,255,255,0.9);
  color: #0a0a0a;
  box-shadow:
    0 2px 0 rgba(255,255,255,1) inset,
    0 10px 30px rgba(255,255,255,0.18),
    0 0 0 0 rgba(255,255,255,0.25);
  animation: bookPulse 2.5s 2s ease-in-out infinite;
}
@keyframes bookPulse {
  0%,100% { box-shadow: 0 2px 0 rgba(255,255,255,1) inset, 0 10px 30px rgba(255,255,255,0.18), 0 0 0 0 rgba(255,255,255,0); }
  50%      { box-shadow: 0 2px 0 rgba(255,255,255,1) inset, 0 10px 30px rgba(255,255,255,0.28), 0 0 0 10px rgba(255,255,255,0); }
}
.bubble-filled:hover .bubble-icon {
  background: rgba(255,255,255,0.93);
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 2px 0 rgba(255,255,255,1) inset, 0 18px 44px rgba(255,255,255,0.25);
  animation: none;
}
.bubble-filled:active .bubble-icon {
  transform: scale(0.9);
  animation: none;
}

.bubble-big-icon .bubble-icon { font-size: 1.7rem; }
.bubble-label {
  font-size: 0.56rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.32);
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  transition: color 0.2s;
}
.bubble:hover .bubble-big-icon .bubble-icon { font-size: 1.7rem; }
.bubble-label { color: rgba(255,255,255,0.55); }

/* ── SEPARATOR ── */
.sep {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent);
  margin: 1.8rem 0;
}

/* ── QR SECTION ── */
.qr-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.65rem;
  animation: fadeUp 0.7s 0.7s cubic-bezier(0.16,1,0.3,1) both;
}
.qr-label {
  font-size: 0.58rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.32);
}
.qr-wrap {
  padding: 13px;
  background: rgba(245,243,238,0.96);
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow:
    0 2px 0 rgba(255,255,255,0.6) inset,
    0 8px 30px rgba(0,0,0,0.5),
    0 2px 8px rgba(0,0,0,0.3);
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
  cursor: pointer;
}
.qr-wrap:hover {
  transform: scale(1.04) translateY(-2px);
  box-shadow: 0 2px 0 rgba(255,255,255,0.6) inset, 0 16px 40px rgba(0,0,0,0.6);
}
#qrcode canvas { display:block; border-radius:4px; }
.qr-sub {
  font-size: 0.52rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.17);
}

/* ── FOOTER ── */
.card-footer {
  margin-top: 1.8rem;
  text-align: center;
  animation: fadeUp 0.6s 0.8s cubic-bezier(0.16,1,0.3,1) both;
}
.card-footer a {
  font-size: 0.58rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.38);
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding-bottom: 1px;
  transition: color 0.25s, border-color 0.25s;
}
.card-footer a:hover { color:rgba(255,255,255,0.5); border-color:rgba(255,255,255,0.3); }
.copyright {
  font-size: 0.5rem;
  color: rgba(255,255,255,0.12);
  letter-spacing: 0.16em;
  margin-top: 0.8rem;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(14px); }
  to   { opacity:1; transform:translateY(0); }
}
</style>
</head>

  var blob = new Blob([vcard],{type:"text/vcard;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href=url; a.download="Josh-Pratt-Blackline.vcf";
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
